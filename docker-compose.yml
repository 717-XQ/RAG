# ============================================================
# RAG智能文档问答系统 - Docker Compose 编排
# ============================================================
# 使用方式:
#   开发环境: docker-compose up -d
#   查看日志: docker-compose logs -f
#   停止:     docker-compose down
# ============================================================

version: "3.8"

services:
  # ---------- RAG主服务 ----------
  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-app
    restart: unless-stopped
    ports:
      - "8000:8000"   # FastAPI API
      - "7860:7860"   # Gradio前端
    environment:
      # 【需手动填写】OpenAI API Key
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your_api_key_here}
      # 可选：自定义API Base URL
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      # 可选：DeepSeek / DashScope API Key（多Provider）
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      # 容器内使用CPU（GPU需要额外配置nvidia-docker）
      - CUDA_VISIBLE_DEVICES=-1
    volumes:
      # 持久化数据（后端整合在 backend/ 目录下）
      - ./backend/chroma_db:/app/backend/chroma_db          # 向量数据库
      - ./backend/uploaded_docs:/app/backend/uploaded_docs  # 上传的文档
      - ./backend/logs:/app/backend/logs                    # 日志
      - ./backend/data:/app/backend/data                    # 数据目录
      - ./backend/evaluations:/app/backend/evaluations      # 评估结果
      # 配置文件挂载（方便修改）
      - ./backend/config.yaml:/app/backend/config.yaml
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 8G    # Embedding和Reranker模型需要较多内存
        reservations:
          memory: 4G

